name: Автоматическая проверка Dashboard (Flexbox & Git CI)

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # Разрешаем роботу писать комментарии в PR студентов

concurrency:
  group: flex-homework-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-homework:
    name: Экспертная проверка ТЗ, кода и Git-коммитов
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Умный статический анализ кода и коммитов
        id: analyzer
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -uo pipefail
          export LC_ALL=C.UTF-8
          git config core.quotepath off

          # Инициализация счетчиков и отчета
          errors_count=0
          warnings_count=0
          report="### 🤖 Отчет робота-валидатора по практической работе №10"$'\n\n'

          add_err() { errors_count=$((errors_count+1)); report+="❌ **ОШИБКА:** $1"$'\n'; }
          add_warn() { warnings_count=$((warnings_count+1)); report+="⚠️ **ПРЕДУПРЕЖДЕНИЕ:** $1"$'\n'; }
          add_ok() { report+="✅ $1"$'\n'; }

          # 1. Получение списка измененных файлов
          if ! git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
            echo "::error::Не удалось получить целевую ветку."
            exit 1
          fi

          changed_files=()
          while IFS= read -r -d '' f; do changed_files+=("$f"); done \
            < <(git diff --name-only -z --diff-filter=ACMR "origin/${BASE_REF}...HEAD")

          # 2. Проверка изоляции и определение папки студента
          STUDENT_DIR=""
          for f in "${changed_files[@]}"; do
            if [[ "$f" =~ ^\.github/ ]]; then
              add_err "Запрещено изменять конфигурационные файлы валидатора (\`$f\`)."
              continue
            fi
            if [[ ! "$f" =~ ^[^/]+_[^/]+_[^/]+/ ]]; then
              add_err "Файл \`$f\` изменен вне Вашей персональной папки. Соблюдайте изоляцию!"
              continue
            fi
            
            current_dir="${f%%/*}"
            if [ -z "$STUDENT_DIR" ]; then
              STUDENT_DIR="$current_dir"
            elif [ "$STUDENT_DIR" != "$current_dir" ]; then
              add_err "Нарушение изоляции: Вы изменили файлы нескольких студентов сразу (\`$STUDENT_DIR\` и \`$current_dir\`)."
            fi
          done

          if [ $errors_count -gt 0 ] || [ -z "$STUDENT_DIR" ]; then
            report+=$'\n'"⛔ **Критическая ошибка изоляции. Проверка кода остановлена.**"
            echo "report<<EOF" >> "$GITHUB_OUTPUT"
            echo "$report" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          add_ok "Контроль изоляции пройден. Ваша рабочая директория: \`$STUDENT_DIR/\`"

          # 3. Парсинг имени, фамилии и умная транслитерация латиницы
          IFS='_' read -r last_name first_name group <<< "$STUDENT_DIR"
          
          to_cyrillic() {
            echo "$1" | sed '
              s/ch/ч/g; s/sh/ш/g; s/zh/ж/g; s/kh/х/g; s/ts/ц/g; 
              s/ya/я/g; s/yu/ю/g; s/ye/е/g; s/yo/ё/g; s/ja/я/g;
              s/a/а/g;  s/b/б/g;  s/v/в/g;  s/g/г/g;  s/d/д/g; 
              s/e/е/g;  s/z/з/g;  s/i/и/g;  s/j/й/g;  s/k/к/g; 
              s/l/л/g;  s/m/м/g;  s/n/н/g;  s/o/о/g;  s/p/п/g; 
              s/r/р/g;  s/s/с/g;  s/t/т/g;  s/u/у/g;  s/f/ф/g; 
              s/h/х/g;  s/c/ц/g;  s/y/ы/g;  s/q/к/g;  s/w/в/g; s/x/кс/g;
              s/CH/ч/g; s/SH/ш/g; s/ZH/ж/g; s/YA/я/g; s/YU/ю/g;
              s/A/а/g;  s/B/б/g;  s/V/в/g;  s/G/г/g;  s/D/д/g;
              s/E/е/g;  s/Z/з/g;  s/I/и/g;  s/K/к/g;  s/L/л/g;
              s/M/м/g;  s/N/н/g;  s/O/о/g;  s/P/п/g;  s/R/р/g;
              s/S/с/g;  s/T/т/g;  s/U/у/g;  s/F/ф/g;  s/Y/ы/g
            '
          }

          last_name_cyr=$(to_cyrillic "$last_name")
          first_name_cyr=$(to_cyrillic "$first_name")

          N=${#last_name_cyr}
          M=${#first_name_cyr}
          
          expected_basis=$(( (N * 12) + 180 ))
          expected_gap=$(( (M * 2) + 4 ))

          report+=$'\n'"#### 🧠 Данные студента и расчет параметров Анти-ИИ:"$'\n'
          report+="- **Студент:** $last_name $first_name (Группа: $group)"$'\n'
          report+="- Подсчитанная длина фамилии ($N букв) -> \`flex-basis\` = **${expected_basis}px**"$'\n'
          report+="- Подсчитанная длина имени ($M букв) -> \`gap\` = **${expected_gap}px**"$'\n\n'

          HTML_FILE="$STUDENT_DIR/index.html"
          CSS_FILE="$STUDENT_DIR/css/style.css"

          # 4. Проверка наличия и контента файлов
          if [ ! -f "$HTML_FILE" ]; then add_err "Файл \`index.html\` не найден."; fi
          if [ ! -f "$CSS_FILE" ]; then add_err "Файл \`css/style.css\` не найден."; fi

          if [ -f "$CSS_FILE" ] && [ -f "$HTML_FILE" ]; then
            report+="#### 🔍 Результаты содержательного анализа кода:"$'\n'
            css_clean=$(tr -d '[[:space:]]' < "$CSS_FILE")

            if [[ "$css_clean" =~ flex-basis:${expected_basis}px ]]; then
              add_ok "Индивидуальный \`flex-basis\` карточки (${expected_basis}px) настроен верно."
            else
              add_err "Нарушение формулы Анти-ИИ: \`flex-basis\` должен быть **${expected_basis}px**."
            fi

            if [[ "$css_clean" =~ gap:${expected_gap}px ]]; then
              add_ok "Индивидуальный \`gap\` контейнеров (${expected_gap}px) настроен верно."
            else
              add_err "Нарушение формулы Анти-ИИ: \`gap\` должен быть **${expected_gap}px**."
            fi

            if grep -q "<header" "$HTML_FILE" && grep -q "<main" "$HTML_FILE"; then
              add_ok "Семантическая структура HTML (<header>, <main>) соблюдена."
            else
              add_err "Нарушение семантики HTML: Вы обязаны использовать теги \`<header>\` и \`<main>\`."
            fi

            if [[ "$css_clean" =~ margin-left:auto ]]; then
              add_ok "Применение \`margin-left: auto\` для кнопки выхода обнаружено."
            else
              add_warn "Рекомендуется использовать \`margin-left: auto\` для выталкивания кнопки выхода к правому краю (уровни Junior/Pro)."
            fi

            if grep -q "/\* Своими словами \*/" "$CSS_FILE"; then
              add_ok "CSS-комментарий \`/* Своими словами */\` с ответами присутствует."
            else
              add_err "В конце файла отсутствует комментарий \`/* Своими словами */\` с развернутыми теоретическими ответами!"
            fi
          fi

          # 5. Экспертный Git Commit Линтер
          report+=$'\n'"#### 📜 Валидация истории коммитов Git (Уровни Junior/Pro):"$'\n'
          
          # Получаем сообщения всех коммитов текущей ветки относительно main
          commit_messages=()
          while IFS= read -r msg; do
            commit_messages+=("$msg")
          done < <(git log "origin/${BASE_REF}...HEAD" --format=%s)

          commit_count=${#commit_messages[@]}
          report+="- Всего коммитов в Вашем Pull Request: **$commit_count**"$'\n'

          # Проверка на количество коммитов (ТЗ требует строго 4 или 5)
          if [ "$commit_count" -lt 4 ] || [ "$commit_count" -gt 5 ]; then
            add_warn "По ТЗ на уровнях Junior/Pro должно быть сделано ровно 4 или 5 содержательных коммитов. У Вас: $commit_count."
          fi

          # Разрешенные регулярные теги для коммитов
          valid_tag_regex="^\[flex-(nav|grid|card-inner|a11y)\]"
          bad_commits=0

          for msg in "${commit_messages[@]}"; do
            if [[ "$msg" =~ $valid_tag_regex ]]; then
              report+="  - ✅ Коммит: \`$msg\` (Семантический тег валиден)"$'\n'
            else
              report+="  - ❌ Коммит: \`$msg\` (Ошибка! Сообщение должно начинаться с [flex-nav], [flex-grid], [flex-card-inner] или [flex-a11y])"$'\n'
              bad_commits=$((bad_commits+1))
            fi
          done

          if [ $bad_commits -gt 0 ]; then
            add_err "В истории Git обнаружено $bad_commits коммитов с некорректными сообщениями. Отредактируйте историю через \`git rebase -i\`."
          else
            add_ok "Все коммиты оформлены строго по семантическому стандарту ТЗ!"
          fi

          # Итоговый статус
          report+=$'\n'"#### 📈 Итоги проверки:"$'\n'
          report+="- Критических ошибок: **$errors_count**"$'\n'
          report+="- Предупреждений: **$warnings_count**"$'\n\n'

          if [ $errors_count -gt 0 ]; then
            report+="❌ **Статус:** Пулл-реквест отклонен. Исправьте ошибки кода или коммитов, чтобы преподаватель принял работу."
            status_flag="failed"
          else
            report+="🎉 **Статус:** Робот одобряет этот PR! Все формулы сошлись, коммиты идеальны. Передаю работу преподавателю."
            status_flag="success"
          fi

          echo "status=$status_flag" >> "$GITHUB_OUTPUT"
          { echo "report<<EOF"; echo "$report"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"

          if [ "$status_flag" == "failed" ]; then exit 1; fi

      # 6. Публикация развернутого ответа робота прямо в Pull Request студента
      - name: Публикация отчета робота в Pull Request
        if: always() && github.event_name == 'pull_request' && steps.analyzer.outputs.report != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.analyzer.outputs.report }}
          comment_tag: "validation-report"
          mode: recreate
